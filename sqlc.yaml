version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/postgres/queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/repository/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: false
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        json_tags_case_style: "snake"
        output_db_file_name: "db.go"
        output_models_file_name: "models.go"
        output_querier_file_name: "querier.go"
        output_files_suffix: "_sql"
        overrides:
          # UUID type mapping
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # JSONB type mapping
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          # INET type mapping
          - db_type: "inet"
            go_type:
              import: "net/netip"
              type: "Addr"
            nullable: true
          # BYTEA type mapping - use default (no override needed, pgx handles it)
          # TIMESTAMPTZ type mapping
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          # DECIMAL type mapping for latitude/longitude
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
            nullable: true
