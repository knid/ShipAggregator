# Air - Live reload for Go apps
# https://github.com/air-verse/air
# 
# Configuration for TR-Only Shipping Aggregation Backend

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Array of commands to run before each build
  pre_cmd = []
  
  # Main binary build command
  cmd = "go build -o ./tmp/main ./cmd/api"
  
  # Binary file yields from `cmd`
  bin = "./tmp/main"
  
  # Customize binary, can setup environment variables when run your app
  full_bin = "APP_ENV=development ./tmp/main"
  
  # Watch these filename extensions
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
  
  # Ignore these filename extensions or directories
  exclude_dir = [
    "assets",
    "tmp",
    "vendor",
    "testdata",
    "node_modules",
    ".git",
    ".idea",
    ".vscode",
    "specs",
    "docs",
    "scripts",
    "configs",
    "tests",
  ]
  
  # Ignore files matching these patterns
  exclude_file = [
    "_test.go",
    ".DS_Store",
    "*.md",
    "*.sql",
  ]
  
  # Ignore unchanged files
  exclude_unchanged = false
  
  # Follow symlinks
  follow_symlink = false
  
  # This log file places in your tmp_dir
  log = "build-errors.log"
  
  # Poll files for changes instead of using fsnotify
  poll = false
  
  # Poll interval (defaults to minimum interval of 500ms)
  poll_interval = 0
  
  # Delay after a file change before rebuilding (in milliseconds)
  delay = 1000
  
  # Stop running old binary when build errors occur
  stop_on_error = true
  
  # Send Interrupt signal before killing process (windows does not support this feature)
  send_interrupt = true
  
  # Delay after sending Interrupt signal before killing process (in milliseconds)
  kill_delay = 500
  
  # Rerun binary or not
  rerun = false
  
  # Delay after each execution
  rerun_delay = 500
  
  # Arguments passed to the binary
  args_bin = []

[log]
  # Show log time
  time = true
  
  # Only show main log (silences watcher, build, runner)
  main_only = false

[color]
  # Customize each part's color. If no color found, use the raw app log
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true

[screen]
  # Keep scroll position when tailing logs
  clear_on_rebuild = true
  # Keep scroll position when tailing logs
  keep_scroll = true
