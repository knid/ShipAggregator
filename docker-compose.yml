# Docker Compose for TR-Only Shipping Aggregation Backend
# ======================================================
# Development environment with PostgreSQL 15, Redis 7, and MinIO

services:
  # PostgreSQL 15 - Primary database
  postgres:
    image: postgres:15-alpine
    container_name: shipping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shipping}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shipping}
      POSTGRES_DB: ${DB_NAME:-shipping}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-shipping} -d ${DB_NAME:-shipping}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipping-network

  # Redis 7 - Cache, rate limiting, and job queue
  redis:
    image: redis:7-alpine
    container_name: shipping-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipping-network

  # MinIO - S3-compatible object storage for documents (labels, etc.)
  minio:
    image: minio/minio:latest
    container_name: shipping-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipping-network

  # MinIO Client - Create initial buckets
  minio-init:
    image: minio/mc:latest
    container_name: shipping-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; mc mb --ignore-existing myminio/shipping-documents; mc mb --ignore-existing myminio/shipping-labels; mc anonymous set download myminio/shipping-labels; exit 0; "
    networks:
      - shipping-network

  # API Server (for production-like testing)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: shipping-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - shipping-network
    profiles:
      - full

  # Background Worker (for production-like testing)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: shipping-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - shipping-network
    profiles:
      - full

  # Asynqmon - Asynq monitoring dashboard
  asynqmon:
    image: hibiken/asynqmon:latest
    container_name: shipping-asynqmon
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "${ASYNQMON_PORT:-8081}:8080"
    networks:
      - shipping-network
    profiles:
      - monitoring

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: shipping-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - shipping-network
    profiles:
      - monitoring

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: shipping-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - shipping-network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  shipping-network:
    driver: bridge
